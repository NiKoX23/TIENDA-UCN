# Config del nginx que sirve el bundle del frontend dentro del contenedor `frontend`.
# El proxy inverso hacia /api y /prediccion vive en el nginx de la raiz del proyecto.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA con BrowserRouter: /login, /register, /perfil, /admin y /producto/:id
    # no existen como archivos, asi que se sirve index.html y el router resuelve.
    # Sin esto, recargar o abrir un link profundo devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre, se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # El index.html nunca se cachea: es el que referencia los hashes nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # nginx:alpine no tiene el tipo .webmanifest en su mime.types.
    # El types va scopeado a la location para no reemplazar los heredados.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}
